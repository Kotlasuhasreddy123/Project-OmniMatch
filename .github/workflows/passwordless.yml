name: Backend verification
on:
  push:
    paths: ["backend/**", ".github/workflows/passwordless.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/passwordless.yml"]
permissions:
  contents: read
jobs:
  signatures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'PyJWT[crypto]==2.15.1' 'fastapi==0.162.2' 'pydantic==2.14.3' 'pydantic-settings==2.16.2' 'httpx==0.27.0' 'pytest==9.2.0' 'pytest-asyncio==1.4.1.post1' 'aiosqlite==0.20.0' 'qdrant-client==1.10.0' 'apscheduler==3.10.4' 'python-multipart==0.0.33'
      - run: python -m pytest backend/tests -q -rx
        env:
          PYTHONPATH: backend
