name: Backend verification
on:
  push:
    paths: ["backend/**", ".github/workflows/passwordless.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/passwordless.yml"]
permissions:
  contents: read
jobs:
  signatures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'python-jose[cryptography]==3.5.0' 'fastapi==0.111.0' 'pydantic==2.7.4' 'pydantic-settings==2.3.0' 'httpx==0.27.0' 'pytest==8.2.2' 'pytest-asyncio==0.23.7' 'aiosqlite==0.20.0' 'qdrant-client==1.10.0' 'apscheduler==3.10.4' 'python-multipart==0.0.9'
      - run: python -m pytest backend/tests -q -rx
        env:
          PYTHONPATH: backend
