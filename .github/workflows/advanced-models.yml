name: Real local transformer verification
on:
  workflow_dispatch:
  pull_request:
    paths: ["backend/app/understanding/**", "backend/app/trials/qdrant_service.py", "backend/prepare_advanced_models.py", "backend/tests/test_local_stack.py", "backend/evaluate_advanced.py", "backend/evaluation/advanced_cases.json", "backend/requirements-advanced.txt", ".github/workflows/advanced-models.yml"]
permissions:
  contents: read
jobs:
  cpu-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      qdrant:
        image: qdrant/qdrant:v1.10.0
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/whisper
          key: advanced-public-models-v2-${{ hashFiles('backend/app/understanding/model_registry.py', 'backend/prepare_advanced_models.py') }}
      - run: pip install 'torch==2.3.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: pip install 'numpy==1.26.4' -r backend/requirements-advanced.txt 'python-jose[cryptography]==3.5.0' 'fastapi==0.111.0' 'pydantic==2.7.4' 'pydantic-settings==2.3.0' 'httpx==0.27.0' 'pytest==8.2.2' 'pytest-asyncio==0.23.7' 'aiosqlite==0.20.0' 'qdrant-client==1.10.0' 'apscheduler==3.10.4' 'python-multipart==0.0.9'
      - run: pip install 'setuptools<81' 'sentence-transformers==3.0.1'
      - run: pip install --no-build-isolation 'openai-whisper==20231117'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python backend/prepare_advanced_models.py
      - run: python backend/evaluate_advanced.py --output /tmp/advanced-model-evaluation.json
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - run: python -m pytest backend/tests/test_real_advanced.py -q
        env:
          PYTHONPATH: backend
          OMNIMATCH_REAL_MODEL_TESTS: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - run: python -m pytest backend/tests/test_local_stack.py -q -s --junitxml=/tmp/local-stack-tests.xml
        env:
          PYTHONPATH: backend
          OMNIMATCH_LOCAL_STACK_TESTS: '1'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: real-transformer-development-evidence
          path: |
            /tmp/advanced-model-evaluation.json
            /tmp/local-stack-tests.xml
