name: Academic public portal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node scripts/license_inventory.mjs
      - run: npm run build
        working-directory: frontend
        env:
          OMNIMATCH_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_BASE_PATH: /Project-OmniMatch
          NEXT_PUBLIC_PORTAL_MODE: 'true'
          NEXT_PUBLIC_WORKOS_CLIENT_ID: ${{ vars.WORKOS_CLIENT_ID }}
          NEXT_PUBLIC_WORKOS_ORG_ID: ${{ vars.WORKOS_ORGANIZATION_ID }}
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish academic portal
        id: deployment
        uses: actions/deploy-pages@v4
