name: Frontend verification
on:
  push:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - run: npm run test:run -- --runInBand
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: docker build -t omnimatch-frontend:verify .
      - name: Check the running frontend container
        run: |
          docker run --detach --name frontend-check -p 127.0.0.1:3000:3000 omnimatch-frontend:verify
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 --retry-max-time 60 http://127.0.0.1:3000/preview > /dev/null || { docker logs frontend-check; exit 1; }
          docker stop frontend-check
      - name: Verify public portal export with repository subpath
        run: npm run build
        env:
          OMNIMATCH_STATIC_EXPORT: 'true'
          OMNIMATCH_NEXT_DIST_DIR: .next-portal-check
          NEXT_PUBLIC_BASE_PATH: /Project-OmniMatch
          NEXT_PUBLIC_PORTAL_MODE: 'true'
