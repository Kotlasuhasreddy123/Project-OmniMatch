# OmniMatch — PRODUCTION environment
# Multi-worker Uvicorn, read-only filesystem mounts, resource limits, no dev tools.
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Pre-requisites:
#   1. Set all secrets in backend/.env (never commit!)
#   2. Obtain TLS certificate (or use AWS ACM via ALB)
#   3. Run: docker compose -f docker-compose.prod.yml pull && up -d

services:

  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: omni_qdrant_prod
    restart: always
    ports: ["127.0.0.1:6333:6333"]   # Bind to loopback only — not public
    volumes:
      - qdrant_prod_data:/qdrant/storage
    deploy:
      resources:
        limits: { memory: 1G }
        reservations: { memory: 512M }
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: omni-backend:prod
    container_name: omni_backend_prod
    restart: always
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --workers 2
        --log-level info
        --access-log
        --proxy-headers
        --forwarded-allow-ips "*"
    depends_on:
      qdrant: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes:
      - backend_prod_data:/app/data
    env_file: ./backend/.env
    environment:
      - APP_ENV=production
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - SQLITE_DB_PATH=/app/data/omni_match.db
    read_only: true                  # Read-only root FS — mounts are writable
    tmpfs:
      - /tmp
      - /app/tmp
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 2G }
        reservations: { memory: 512M }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: omni-frontend:prod
    container_name: omni_frontend_prod
    restart: always
    depends_on:
      backend: { condition: service_healthy }
    ports: ["3000:3000"]
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    read_only: true
    tmpfs: ["/tmp"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # Nginx reverse proxy for TLS termination + routing
  nginx:
    image: nginx:1.27-alpine
    container_name: omni_nginx_prod
    restart: always
    depends_on: [backend, frontend]
    ports: ["80:80", "443:443"]
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro   # Mount your TLS certs here
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  qdrant_prod_data:
    driver: local
  backend_prod_data:
    driver: local

networks:
  default:
    name: omni_prod_network
    driver: bridge
